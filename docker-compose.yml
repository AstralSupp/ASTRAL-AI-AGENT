version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: astral-postgres
    environment:
      POSTGRES_USER: astral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astral_secure_password_change_me}
      POSTGRES_DB: astral_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astral -d astral_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astral-network
    restart: unless-stopped

  # AI Agent Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astral-ai-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Server
      NODE_ENV: production
      PORT: 3000

      # Database (Postgres connection string)
      DATABASE_URL: postgresql://astral:${POSTGRES_PASSWORD:-astral_secure_password_change_me}@postgres:5432/astral_db

      # Chatwoot
      CHATWOOT_URL: ${CHATWOOT_URL:-https://chatwoot.astralsup.com}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-7qNGm4ixCxpqQRrQ5Erh4rv5}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-1}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:-1}

      # AI Services
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-yoiZfrc4wQ9Rs1QGpnm5}

      # Agent Config
      AGENT_NAME: ${AGENT_NAME:-Astral}
      BUSINESS_NAME: ${BUSINESS_NAME:-AstralSup}
      BUSINESS_DESCRIPTION: ${BUSINESS_DESCRIPTION:-Empresa brasileira de atendimento ao cliente}
      BUSINESS_LANGUAGE: ${BUSINESS_LANGUAGE:-pt-BR}

      # Message Handling
      MESSAGE_BURST_DELAY_MS: ${MESSAGE_BURST_DELAY_MS:-3000}
      TYPING_SPEED_CPS: ${TYPING_SPEED_CPS:-50}
      MAX_TYPING_INDICATOR_MS: ${MAX_TYPING_INDICATOR_MS:-10000}

      # Admin Dashboard
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_password}

    ports:
      - "${PORT:-3000}:3000"
    networks:
      - astral-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - logs:/app/logs

volumes:
  postgres_data:
    driver: local
  logs:
    driver: local

networks:
  astral-network:
    driver: bridge
