version: '3.8'

services:
  astral-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - CHATWOOT_URL=${CHATWOOT_URL}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID}
      - CHATWOOT_INBOX_ID=${CHATWOOT_INBOX_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - AGENT_NAME=${AGENT_NAME:-Astral}
      - BUSINESS_NAME=${BUSINESS_NAME}
      - BUSINESS_DESCRIPTION=${BUSINESS_DESCRIPTION}
      - BUSINESS_LANGUAGE=${BUSINESS_LANGUAGE:-pt-BR}
      - MESSAGE_BURST_DELAY_MS=${MESSAGE_BURST_DELAY_MS:-3000}
      - TYPING_SPEED_CPS=${TYPING_SPEED_CPS:-50}
      - MAX_TYPING_INDICATOR_MS=${MAX_TYPING_INDICATOR_MS:-10000}
      - WHATSAPP_PHONE_NUMBER=${WHATSAPP_PHONE_NUMBER}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
