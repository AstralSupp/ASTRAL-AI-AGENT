version: '3.8'

services:
  # PostgreSQL Database with Supabase extensions
  postgres:
    image: 'supabase/postgres:15.1.1.54'
    pull_policy: always
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: always
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
      - './database/init:/docker-entrypoint-initdb.d'
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-postgres}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astral-network

  # PostgREST - Auto REST API for PostgreSQL (Supabase)
  rest:
    image: 'postgrest/postgrest:v12.0.2'
    pull_policy: always
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-postgres}
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - PGRST_DB_USE_LEGACY_GUCS=false
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://localhost:3000/ || exit 1'
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - astral-network

  # AI Agent Application
  app:
    image: '${APP_IMAGE:-ghcr.io/astralsup/astral-ai-agent:latest}'
    pull_policy: always
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rest:
        condition: service_healthy
    volumes:
      - 'logs:/app/logs'
    environment:
      # Server Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}

      # Supabase Configuration (Internal)
      - SUPABASE_URL=http://rest:3000
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}

      # Chatwoot Configuration
      - CHATWOOT_URL=${CHATWOOT_URL}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID:-1}
      - CHATWOOT_INBOX_ID=${CHATWOOT_INBOX_ID:-1}

      # AI Service API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-yoiZfrc4wQ9Rs1QGpnm5}

      # Agent Configuration
      - AGENT_NAME=${AGENT_NAME:-Astral}
      - BUSINESS_NAME=${BUSINESS_NAME:-AstralSup}
      - BUSINESS_DESCRIPTION=${BUSINESS_DESCRIPTION:-Empresa brasileira de atendimento ao cliente com inteligência artificial}
      - BUSINESS_LANGUAGE=${BUSINESS_LANGUAGE:-pt-BR}

      # Message Handling
      - MESSAGE_BURST_DELAY_MS=${MESSAGE_BURST_DELAY_MS:-3000}
      - TYPING_SPEED_CPS=${TYPING_SPEED_CPS:-50}
      - MAX_TYPING_INDICATOR_MS=${MAX_TYPING_INDICATOR_MS:-10000}

      # Admin Dashboard
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - SESSION_SECRET=${SERVICE_PASSWORD_64_SESSION}

    ports:
      - '3000:3000'
    networks:
      - astral-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://localhost:3000/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  logs:
    driver: local

networks:
  astral-network:
    driver: bridge
